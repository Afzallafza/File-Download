spring:
  application:
    name: Project__Management
  datasource:
    url: jdbc:mysql://localhost:3306/CachePractice?useSSL=false
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
server:
  error:
    whitelabel:
      enabled: false
  port: 8081
  tomcat:
    connection-timeout: 500000
    max-http-form-post-size: 20MB



